name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: |
            electron/package-lock.json
            webui/package-lock.json

      - name: Verify release tag version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $packageVersion = (Get-Content electron/package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$packageVersion") {
            throw "Release tag $env:GITHUB_REF_NAME must match electron/package.json version v$packageVersion."
          }

      - name: Restore desktop dependencies
        run: npm ci
        working-directory: electron

      - name: Test Electron update version handling
        run: npm test
        working-directory: electron

      - name: Audit desktop dependencies
        run: npm audit --audit-level=high
        working-directory: electron

      - name: Audit web UI dependencies
        run: npm --prefix ../webui audit --audit-level=high
        working-directory: electron

      - name: Test audio and application behavior
        run: dotnet test tests/SimplySound.Tests/SimplySound.Tests.csproj -c Release -r win-x64

      - name: Build Windows installer and portable app
        run: npm run dist
        working-directory: electron

      - name: Upload Windows releases
        uses: actions/upload-artifact@v7
        with:
          name: SimplySound-Windows-x64
          path: |
            dist-electron/SimplySound-*-Setup.exe
            dist-electron/SimplySound-*-Windows.exe
          if-no-files-found: error
          retention-days: 14
